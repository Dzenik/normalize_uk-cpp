name: CI

on:
  push:
    branches: [main]
    paths:
      - '**.cpp'
      - '**.cc'
      - '**.cxx'
      - '**.h'
      - '**.hpp'
      - '**.hxx'
      - '**.py'
      - '**.pyi'
  pull_request:
    paths:
      - '**.cpp'
      - '**.cc'
      - '**.cxx'
      - '**.h'
      - '**.hpp'
      - '**.hxx'
      - '**.py'
      - '**.pyi'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python build dependencies
        run: python -m pip install pybind11
      # Keep IPO off here because the Clang LTO archive cannot be linked into
      # the CLI and test executables by the default Linux linker.
      - name: Configure with Clang
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=clang++
          -DNORMALIZE_UK_CPP_ENABLE_RELEASE_IPO=OFF
          -DNORMALIZE_UK_CPP_BUILD_TESTS=ON
          -DNORMALIZE_UK_CPP_BUILD_PYTHON=ON
      - name: Configure with ClangCL
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A x64 -T ClangCL
          -DNORMALIZE_UK_CPP_ENABLE_RELEASE_IPO=OFF
          -DNORMALIZE_UK_CPP_BUILD_TESTS=ON
          -DNORMALIZE_UK_CPP_BUILD_PYTHON=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test normalization with a constrained native stack
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ulimit -s 256
          ./build/uktextnorm --preset tts-friendly "5–7 °C"

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure ASan and UBSan
        env:
          CC: clang
          CXX: clang++
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DNORMALIZE_UK_CPP_BUILD_TESTS=ON -DNORMALIZE_UK_CPP_BUILD_FUZZER=ON
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure
      - name: Fuzzer smoke test
        run: ./build-sanitize/uktextnorm_fuzzer -runs=1 tests/data/uktextnorm_cli_uncertain_lines.txt
